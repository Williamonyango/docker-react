services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - /app/node_modules
      - .:/app
  test:
   build:
    context: . 
    dockerfile: Dockerfile.dev
   command: npm run test
   volumes:
   - /app/node_modules
   - .:/app
 